[project]
name = "imagineimage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.38.29",
    "python-dotenv>=1.0.0",
    "openai==1.84.0",
    "pillow>=11.2.1",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
exclude-newer = "1 week"

[tool.bandit]
skips = ["B311"]  # random used only for non-security selection (art styles, prompts, images)
